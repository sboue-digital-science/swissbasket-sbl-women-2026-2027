# Temporary: inspect the shot data in one LiveStats game (to be removed after the check)
name: Probe LiveStats shot data
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Inspect shots
        run: |
          node -e '
          (async()=>{
            const d=await (await fetch("https://fibalivestats.dcd.shared.geniussports.com/data/2909458/data.json",{headers:{"user-agent":"Mozilla/5.0"}})).json();
            for(const k of ["1","2"]){const t=d.tm[k];const sh=t.shot||[];
              console.log("TEAM",t.name,"shots",sh.length,"made",sh.filter(s=>s.r==1).length,"| box FGA",t.tot_sFieldGoalsAttempted,"FGM",t.tot_sFieldGoalsMade,"3PA",t.tot_sThreePointersAttempted);
              console.log("KEYS",Object.keys(sh[0]||{}).join(","));
              console.log("SAMPLE",JSON.stringify(sh.slice(0,4)));
              const xs=sh.map(s=>+s.x),ys=sh.map(s=>+s.y);console.log("XRANGE",Math.min(...xs),Math.max(...xs),"YRANGE",Math.min(...ys),Math.max(...ys));
              const by={};for(const s of sh){const kk=s.actionType+"/"+s.subType;by[kk]=(by[kk]||0)+1}console.log("TYPES",JSON.stringify(by));
              const per={};for(const s of sh){per[s.per]=(per[s.per]||0)+1}console.log("PERIODS",JSON.stringify(per));
              console.log("ALLXY",JSON.stringify(sh.map(s=>[+s.x,+s.y,s.r,s.actionType,s.per])));
            }
          })().catch(e=>{console.error(e);process.exit(1)})'
