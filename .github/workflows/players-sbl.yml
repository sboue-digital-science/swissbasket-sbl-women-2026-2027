name: SBL Women player profiles (run by hand)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  players:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Collect player profiles
        run: node players-sbl.mjs
      - name: Commit changes
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add players_info.csv 2>/dev/null || true
          if git diff --cached --quiet; then echo "No changes."; else git commit -m "Update SBL Women player profiles" && git pull --rebase && git push; fi
